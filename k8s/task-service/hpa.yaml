apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
	name: task-service
	namespace: task-manager
spec:
	scaleTargetRef:
		apiVersion: apps/v1
		kind: Deployment
		name: task-service
	minReplicas: 2
	maxReplicas: 5
	metrics:
		- type: Resource
			resource:
				name: cpu
				target:
					type: Utilization
					averageUtilization: 70
