apiVersion: apps/v1
kind: Deployment
metadata:
	name: frontend
	namespace: task-manager
spec:
	replicas: 2
	selector:
		matchLabels:
			app: frontend
	template:
		metadata:
			labels:
				app: frontend
		spec:
			containers:
				- name: frontend
					image: docker.io/01alireza/task-manager-frontend:1.0.0
					ports:
						- containerPort: 80
					resources:
						requests:
							cpu: 50m
							memory: 64Mi
						limits:
							cpu: 250m
							memory: 256Mi
					readinessProbe:
						httpGet:
							path: /
							port: 80
						initialDelaySeconds: 5
						periodSeconds: 10
